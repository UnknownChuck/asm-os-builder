# ASM OS - low-memory tuning (assumes zram swap)

# Prefer compressing idle pages over dropping file cache.
vm.swappiness = 150
# zram has no seek cost: swap one page at a time.
vm.page-cluster = 0
vm.vfs_cache_pressure = 100
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.watermark_boost_factor = 0
kernel.nmi_watchdog = 0
kernel.printk = 3 3 3 3
