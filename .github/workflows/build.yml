name: Build ASM OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up extra disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin mtools dosfstools zstd

      - name: Build ASM OS ISO
        run: |
          if [ -f build.sh ]; then
            chmod +x build.sh
            sudo ./build.sh
          elif [ -f Makefile ]; then
            sudo make
          else
            ls -la
            exit 1
          fi

      - name: Upload ASM OS ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASM-OS-ISO
          path: "**/*.iso"
          if-no-files-found: error
