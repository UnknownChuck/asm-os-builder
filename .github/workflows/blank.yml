name: Build ASM-OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up extra disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Build ASM-OS ISO
        run: |
          chmod +x build.sh
          sudo ./build.sh

      - name: Upload ASM-OS ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASM-OS-ISO
          path: |
            out/ASM-OS.iso
            out/ASM-OS.iso.sha256
          retention-days: 7
